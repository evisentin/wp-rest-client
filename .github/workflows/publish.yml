name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate release tag and Maven version
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          version = ET.parse("pom.xml").getroot().findtext("{http://maven.apache.org/POM/4.0.0}version")
          tag = os.environ["GITHUB_REF_NAME"]
          if os.environ["GITHUB_REF_TYPE"] != "tag":
              raise SystemExit("::error::Publishing requires a release tag. Select a v<version> tag when running manually.")
          if not version or version.endswith("-SNAPSHOT"):
              raise SystemExit(f"::error::Release tag {tag} contains Maven version {version}; publishing snapshots is not allowed.")
          if tag != f"v{version}":
              raise SystemExit(f"::error::Release tag {tag} does not match Maven version {version} (expected v{version}).")
          print(f"Validated release {tag}")
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish to Maven Central
        run: |
          ./mvnw -B clean install \
            -Prelease \
            -Dmaven.test.skip=true

          ./mvnw -B deploy \
            -Prelease \
            -pl .,wp-rest-client-domain,wp-rest-client-gutenberg,wp-rest-client-okhttp,wp-rest-client-apache \
            -Dmaven.test.skip=true
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
